<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css" media="all">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                <image src="imagens/pexels-pixabay-434205.jpg"></image>
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div id="email">
                        <label for="iemail" id="iemail"><span class="material-icons md-80">person</span></label>
                        <input type="email" name="email" id="iemail" autocomplete="email" placeholder="seu email">
                    </div>
                    <div id="senha">
                        <label for="isenha" id="isenha"><span class="material-icons md-48">key</span></label>
                        <input type="password" name="senha" id="isenha" autocomplete="current-password" placeholder="sua senha" required minlength="8" maxlength="20">
                    </div>

                    <input type="submit" value="Entrar" id="entrar">

                    <div>
                        <input type="button" value="Esqueci a Senha"  id="esquecer_senha">
                        <span id="mail" class="material-icons">mail</span>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
